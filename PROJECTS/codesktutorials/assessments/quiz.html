  <div class="quiz-wrap">

  <script>
    window.QUIZ_DATA = [
      { q: "Which operator is used to multiply numbers?", options: ["<code>/</code>", "<code>+</code>", "<code>=</code>", "<code>*</code>"], answer: 3, explain: "The asterisk <code>*</code> is the multiplication operator in most languages." },
      { q: "Array indexes start with:", options: ["<code>0</code>", "<code>1</code>", "<code>2</code>", "<code>3</code>"], answer: 0, explain: "Arrays are zero-indexed — the first element lives at index 0." },
      { q: "To declare an array in Java, define the variable type with:", options: ["<code>{}</code>", "<code>//</code>", "<code>()</code>", "<code>[]</code>"], answer: 3, explain: "Arrays are declared using square brackets, e.g. <code>int[] x</code>." },
      { q: "Which operator is used to add together two values?", options: ["<code>*</code>", "<code>/</code>", "<code>+</code>", "<code>&amp;</code>"], answer: 2, explain: "The plus sign <code>+</code> performs addition." },
      { q: "How do you create a variable with the numeric value 5?", options: ["<code>num x = 5;</code>", "<code>int x = 5;</code>", "<code>x = 5;</code>", "<code>data = 5;</code>"], answer: 1, explain: "In Java and C#, <code>int x = 5;</code> declares an integer variable named x with value 5." },
      { q: "How do you insert a single line COMMENT in Java code?", options: ["<code>//Comment</code>", "<code>#Comment</code>", "<code>&lt;!--Comment--&gt;</code>", "<code>/*Comment*/</code>"], answer: 0, explain: "A double slash <code>//</code> starts a single-line comment." },
      { q: "What is a correct syntax to output &ldquo;Hello World&rdquo; in C#?", options: ["<code>Console.WriteLine(\"Hello World\");</code>", "<code>print(\"Hello World\");</code>", "<code>System.out.println(\"Hello World\");</code>", "<code>echo(\"Hello World\");</code>"], answer: 0, explain: "C# uses <code>Console.WriteLine(...)</code> to print to the console." },
      { q: "What maximum value can be stored in an integer data type?", options: ["<code>2,147,483,647</code>", "Unlimited", "<code>10</code>", "<code>1,000</code>"], answer: 0, explain: "A 32-bit signed <code>int</code> ranges from -2,147,483,648 to 2,147,483,647." },
      { q: "Which data type is used to represent a single character in Java?", options: ["<code>char</code>", "<code>short</code>", "<code>String</code>", "<code>boolean</code>"], answer: 0, explain: "<code>char</code> stores a single Unicode character." },
      { q: "What is the basic data type used to store whole numbers in Java?", options: ["<code>String</code>", "<code>int</code>", "<code>float</code>", "<code>double</code>"], answer: 1, explain: "<code>int</code> is the go-to type for whole numbers." },
      { q: "Subclasses in Java can inherit properties and behaviors from a parent class. This uses the keyword:", options: ["<code>static</code>", "<code>extend</code>", "<code>extends</code>", "<code>this</code>"], answer: 2, explain: "Inheritance is declared with <code>class Child extends Parent</code>." },
      { q: "Encapsulation in Java is achieved with getters/setters and using:", options: ["Access Modifiers", "Public methods", "Static Methods", "None of the above"], answer: 0, explain: "Access modifiers like <code>private</code> protect fields while controlled access goes through getters and setters." },
      { q: "Which is a good way to instantiate an array in C#?", options: ["<code>int myArray[] = { 1, 3, 5 };</code>", "<code>int myArray[][] = {1,2,3,4};</code>", "<code>int[] myArray = (5, 4, 3);</code>", "<code>int[] myArray = {\"1\", \"2\", \"3\"};</code>"], answer: 0, explain: "The others use wrong brackets or wrong element types." },
      { q: "What is a class in Java?", options: ["A special data type", "A blueprint from which objects are created", "Used to allocate memory", "None of the above"], answer: 1, explain: "A class defines fields and methods that describe the behavior of objects created from it." },
      { q: "Which statement about the <code>public</code> access modifier is correct?", options: ["Public members can be accessed by any class", "Public members are only accessible by the child class", "Only classes in the same package can access them", "All of the above"], answer: 0, explain: "<code>public</code> means no access restriction." },
      { q: "Correct JavaScript syntax to change the content of the element below? <code>&lt;p id=&quot;demo&quot;&gt;...&lt;/p&gt;</code>", options: ["<code>#demo.innerHTML = ...</code>", "<code>document.getElement(\"p\").innerHTML = ...</code>", "<code>#demo.innerHTML = ...</code>", "<code>document.getElementById(\"demo\").innerHTML = ...</code>"], answer: 3, explain: "Use <code>document.getElementById(\"demo\")</code> then set <code>innerHTML</code>." },
      { q: "How do you create a function in JavaScript?", options: ["<code>function = myFunction()</code>", "<code>function:myFunction()</code>", "<code>function myFunction()</code>", "<code>function() myfunction</code>"], answer: 2, explain: "Functions are declared as <code>function name() { }</code>." },
      { q: "Which conditional statement lets you run different code based on the value of a variable?", options: ["<code>if</code>", "<code>else</code>", "<code>else if</code>", "<code>switch</code>"], answer: 3, explain: "A <code>switch</code> compares an expression against multiple <code>case</code> values." },
      { q: "It is used to repeatedly execute a block of code until a particular condition is met.", options: ["Arrays", "Loops", "Conditionals", "Functions"], answer: 1, explain: "Loops (for, while, do-while) run code repeatedly." },
      { q: "To create an instance of a class in Java, use the &ldquo;____&rdquo; keyword followed by the class name.", options: ["<code>double</code>", "<code>min</code>", "<code>new</code>", "<code>private</code>"], answer: 2, explain: "<code>new</code> instantiates an object from a class." }
    ];
